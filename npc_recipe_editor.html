<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Recipe — PW155</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body class="panel-page"><div class="sky" aria-hidden="true"></div>
<header class="topbar"><a class="brand" href="/admin/data/npc/services/detail?npc={{NPC_ID}}"><span class="brand-mark">PW</span><span><strong>PW155</strong><small>RECIPE EDITOR</small></span></a><div class="top-actions"><a class="text-link" href="/admin/data/npc/services/detail?npc={{NPC_ID}}">Kembali ke NPC</a><form method="post" action="/logout" class="inline-form"><input type="hidden" name="csrf" value="{{CSRF}}"><button type="submit" class="text-button">Logout</button></form></div></header>
<main class="panel-shell editor-shell">{{NOTICE}}<section class="panel-hero compact-hero"><div><span class="section-kicker">RECIPE ID {{RECIPE_ID}}</span><h1>{{RECIPE_NAME}}</h1><p>Tentukan hasil crafting, peluang, jumlah hasil, biaya, waktu, dan bahan.</p></div></section>
<form method="post" action="/admin/data/npc/services/recipe/save" class="panel-block data-edit-form"><input type="hidden" name="csrf" value="{{CSRF}}"><input type="hidden" name="npc_id" value="{{NPC_ID}}"><input type="hidden" name="recipe_id" value="{{RECIPE_ID}}"><div class="edit-form-grid"><label>Nama recipe<input name="Name" maxlength="63" value="{{RECIPE_NAME}}" required></label><label>Item ID hasil<input type="number" name="targets_1_id_to_make" min="1" max="2147483647" value="{{OUTPUT_ID}}" required></label><label>Peluang hasil<input type="number" name="targets_1_probability" min="0" max="1" step="0.000001" value="{{PROBABILITY}}" required></label><label>Jumlah hasil<input type="number" name="num_to_make" min="1" max="2147483647" value="{{NUM_TO_MAKE}}" required></label><label>Biaya koin<input type="number" name="price" min="0" max="2147483647" value="{{PRICE}}" required></label><label>Waktu produksi<input type="number" name="duration" min="0" max="2147483647" value="{{DURATION}}" required></label></div><h2 class="subform-title">Bahan crafting</h2><div class="materials-grid">{{MATERIAL_INPUTS}}</div><label class="check-label confirm-draft"><input type="checkbox" name="confirm" value="yes" required>Saya sudah memeriksa hasil dan semua bahan. Simpan ke draft service.</label><div class="form-actions"><button type="submit">Simpan recipe ke draft</button></div></form></main><footer><span>PW155 Recipe Editor</span><span>Hingga 32 bahan per recipe</span></footer></body></html>
