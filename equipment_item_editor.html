<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Equipment — PW155</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body class="panel-page"><div class="sky" aria-hidden="true"></div><header class="topbar"><a class="brand" href="/admin/data/equipment"><span class="brand-mark">PW</span><span><strong>PW155</strong><small>EQUIPMENT EDITOR</small></span></a><div class="top-actions"><a class="text-link" href="/admin/data/equipment">Kembali ke Equipment</a><form method="post" action="/logout" class="inline-form"><input type="hidden" name="csrf" value="{{CSRF}}"><button type="submit" class="text-button">Logout</button></form></div></header>
<main class="panel-shell editor-shell">{{NOTICE}}<section class="panel-hero compact-hero"><div><span class="section-kicker">{{TYPE_LABEL}} RECORD #{{ROW_INDEX}}</span><h1>Edit <em>{{Name}}</em></h1><p>Admin {{USERNAME}} · perubahan disimpan sebagai draft aman.</p></div></section>
<form method="post" action="/admin/data/equipment/item/save" class="panel-block data-edit-form"><input type="hidden" name="csrf" value="{{CSRF}}"><input type="hidden" name="type" value="{{TYPE}}"><input type="hidden" name="row_index" value="{{ROW_INDEX}}"><div class="edit-form-grid">
<label>Equipment ID<input type="number" name="ID" min="1" max="2147483647" value="{{ID}}" required></label><label>Nama equipment<input name="Name" maxlength="31" value="{{Name}}" required></label><label class="wide-field">Path icon<input name="file_icon" maxlength="127" value="{{file_icon}}"></label>
<label>Grade<input type="number" name="level" min="0" max="2147483647" value="{{level}}" required></label><label>Level karakter<input type="number" name="require_level" min="0" max="2147483647" value="{{require_level}}" required></label><label>STR<input type="number" name="require_strength" min="0" max="2147483647" value="{{require_strength}}" required></label><label>DEX<input type="number" name="require_agility" min="0" max="2147483647" value="{{require_agility}}" required></label><label>INT<input type="number" name="require_energy" min="0" max="2147483647" value="{{require_energy}}" required></label><label>VIT<input type="number" name="require_tili" min="0" max="2147483647" value="{{require_tili}}" required></label><label>Reputasi<input type="number" name="require_reputation" min="0" max="2147483647" value="{{require_reputation}}" required></label>
<label>Harga NPC<input type="number" name="price" min="0" max="2147483647" value="{{price}}" required></label><label>Harga jual<input type="number" name="shop_price" min="0" max="2147483647" value="{{shop_price}}" required></label><label>Durability minimum<input type="number" name="durability_min" min="0" max="2147483647" value="{{durability_min}}" required></label><label>Durability maksimum<input type="number" name="durability_max" min="0" max="2147483647" value="{{durability_max}}" required></label>{{STAT_INPUTS}}</div>
<label class="check-label confirm-draft"><input type="checkbox" name="confirm" value="yes" required>Saya sudah memeriksa Equipment ID dan statistik. Buat draft tanpa mengubah elements.data aktif.</label><div class="form-actions"><button type="submit" name="mode" value="edit">Simpan perubahan ke draft</button><button type="submit" name="mode" value="clone" class="secondary-button">Duplikasi sebagai equipment baru</button></div></form></main><footer><span>PW155 Equipment Editor</span><span>Draft tervalidasi sebelum pemasangan</span></footer></body></html>
