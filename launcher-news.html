<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=EmulateIE7">
  <title>PW155 News</title>
  <style type="text/css">
    html, body { margin: 0; padding: 0; background: #f4f1e8; color: #302b22; font-family: Arial, Tahoma, sans-serif; font-size: 12px; }
    #header { height: 28px; padding: 8px 14px 0 14px; color: #f7e8bc; background: #344a42; border-bottom: 2px solid #b49351; }
    #header strong { font-size: 14px; letter-spacing: 1px; }
    #header span { float: right; padding-top: 2px; color: #d8cfb6; font-size: 11px; }
    #news-list { padding: 8px 12px 14px 12px; }
    .news-item { padding: 7px 8px 8px 8px; border-bottom: 1px solid #c9c0a9; background: #faf8f1; }
    .news-item.first { border-left: 3px solid #b49351; background: #fffdf6; }
    .news-date { float: right; margin-left: 12px; color: #786c55; font-size: 10px; }
    .news-title { margin: 0 0 3px 0; color: #365d50; font-size: 13px; }
    .news-body { margin: 0; color: #514a3d; line-height: 16px; }
    .empty { padding: 38px 15px; text-align: center; color: #786c55; }
  </style>
</head>
<body>
  <div id="header"><strong>PW155 NEWS</strong><span>Latest realm updates</span></div>
  <div id="news-list">{{LAUNCHER_NEWS}}</div>
</body>
</html>
