<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=EmulateIE7">
  <title>PW155 News</title>
  <style type="text/css">
    html, body { margin: 0; padding: 0; background: #080d16; color: #e7edf5; font-family: Arial, "Segoe UI", Tahoma, sans-serif; font-size: 12px; }
    #header { height: 28px; padding: 8px 14px 0 14px; color: #e7edf5; background: #0c1420; border-bottom: 2px solid #4d8eff; }
    #header strong { font-size: 14px; letter-spacing: 1px; }
    #header span { float: right; padding-top: 2px; color: #d9b46e; font-size: 11px; }
    #news-list { padding: 8px 12px 14px 12px; }
    .news-item { padding: 7px 8px 8px 8px; border-bottom: 1px solid #253246; background: #111a28; }
    .news-item.first { border-left: 3px solid #4d8eff; background: #16243a; }
    .news-date { float: right; margin-left: 12px; color: #d9b46e; font-size: 10px; }
    .news-title { margin: 0 0 3px 0; color: #e7edf5; font-size: 13px; }
    .news-body { margin: 0; color: #94a3b8; line-height: 16px; }
    .empty { padding: 38px 15px; text-align: center; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="header"><strong>PW155 NEWS</strong><span>Latest realm updates</span></div>
  <div id="news-list">{{LAUNCHER_NEWS}}</div>
</body>
</html>
