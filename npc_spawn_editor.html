<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit NPC Spawn — PW155</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body class="panel-page"><div class="sky" aria-hidden="true"></div>
<header class="topbar"><a class="brand" href="/admin/data/npc"><span class="brand-mark">PW</span><span><strong>PW155</strong><small>NPC SPAWN EDITOR</small></span></a>
<div class="top-actions"><a class="text-link" href="/admin/data/npc">Kembali ke NPC</a><form method="post" action="/logout" class="inline-form"><input type="hidden" name="csrf" value="{{CSRF}}"><button type="submit" class="text-button">Logout</button></form></div></header>
<main class="panel-shell editor-shell">{{NOTICE}}<section class="panel-hero compact-hero"><div><span class="section-kicker">GROUP {{GROUP_INDEX}} · ENTRY {{ENTRY_INDEX}}</span><h1>Edit <em>spawn NPC</em></h1><p>Ubah koordinat, jumlah, waktu respawn, atau jadikan spawn selalu aktif dengan Trigger ID 0.</p></div></section>
<form method="post" action="/admin/data/npc/spawn/save" class="panel-block data-edit-form"><input type="hidden" name="csrf" value="{{CSRF}}"><input type="hidden" name="group_index" value="{{GROUP_INDEX}}"><input type="hidden" name="entry_index" value="{{ENTRY_INDEX}}"><div class="edit-form-grid">
<label>NPC ID<input type="number" name="npc_id" min="1" max="2147483647" value="{{NPC_ID}}" required></label><label>Jumlah spawn<input type="number" name="amount" min="1" max="1000000" value="{{AMOUNT}}" required></label>
<label>Respawn (detik)<input type="number" name="respawn" min="0" max="2147483647" value="{{RESPAWN}}" required></label><label>Trigger ID<input type="number" name="trigger_id" min="0" max="2147483647" value="{{TRIGGER_ID}}" required><small>0 = selalu aktif.</small></label>
<label>Koordinat X<input type="number" name="x" step="0.001" min="-1000000" max="1000000" value="{{X}}" required></label><label>Koordinat Y<input type="number" name="y" step="0.001" min="-1000000" max="1000000" value="{{Y}}" required></label><label>Koordinat Z<input type="number" name="z" step="0.001" min="-1000000" max="1000000" value="{{Z}}" required></label></div>
<label class="check-label confirm-draft"><input type="checkbox" name="confirm" value="yes" required>Saya sudah memeriksa NPC ID dan lokasi. Buat draft tanpa mengubah map aktif.</label><div class="form-actions"><button type="submit" name="mode" value="edit">Simpan perubahan ke draft</button><button type="submit" name="mode" value="clone" class="secondary-button">Duplikasi sebagai spawn baru</button></div></form></main><footer><span>PW155 NPC Spawn Editor</span><span>Draft tervalidasi sebelum pemasangan</span></footer></body></html>
