<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Boutique — PW155</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="panel-page">
  <div class="sky" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/admin/data">
      <span class="brand-mark">PW</span>
      <span><strong>PW155</strong><small>BOUTIQUE EDITOR</small></span>
    </a>
    <div class="top-actions">
      <a class="text-link" href="/admin/data">Kembali ke Workshop</a>
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <button type="submit" class="text-button">Logout</button>
      </form>
    </div>
  </header>

  <main class="panel-shell editor-shell">
    {{NOTICE}}
    <section class="panel-hero compact-hero">
      <div>
        <span class="section-kicker">BOUTIQUE RECORD #{{ITEM_INDEX}}</span>
        <h1>Edit <em>{{ITEM_NAME}}</em></h1>
        <p>Admin {{USERNAME}} · Simpan sebagai draft aman atau duplikasi menjadi slot baru.</p>
      </div>
    </section>

    <form method="post" action="/admin/data/boutique/save" class="panel-block data-edit-form"
          data-category-editor data-categories="{{CATEGORY_DATA}}">
      <input type="hidden" name="csrf" value="{{CSRF}}">
      <input type="hidden" name="item_index" value="{{ITEM_INDEX}}">
      <div class="edit-form-grid">
        <label>Item ID
          <input type="number" name="item_id" min="1" max="2147483647" value="{{ITEM_ID}}" required>
        </label>
        <label>Nama item
          <input name="name" maxlength="31" value="{{ITEM_NAME}}" required>
        </label>
        <label>Jumlah per pembelian
          <input type="number" name="amount" min="1" max="999999" value="{{ITEM_AMOUNT}}" required>
        </label>
        <label>Harga cash
          <input type="number" name="price_cash" min="1" max="2000000000" value="{{ITEM_PRICE}}" required>
          <small>100 cash = 1 Gold Boutique.</small>
        </label>
        <label>Kategori
          <select name="category" data-category-select>{{CATEGORY_OPTIONS}}</select>
        </label>
        <label>Subkategori
          <select name="subcategory" data-subcategory-select>{{SUBCATEGORY_OPTIONS}}</select>
        </label>
        <label class="wide-field">Path icon
          <input name="icon" maxlength="127" value="{{ITEM_ICON}}">
        </label>
        <label class="wide-field">Deskripsi
          <textarea name="description" maxlength="511" rows="7">{{ITEM_DESCRIPTION}}</textarea>
        </label>
      </div>
      <label class="check-label confirm-draft">
        <input type="checkbox" name="confirm" value="yes" required>
        Saya sudah memeriksa Item ID, jumlah, kategori, dan harga. Buat draft tanpa mengubah file aktif.
      </label>
      <div class="form-actions">
        <button type="submit" name="mode" value="edit">Simpan perubahan ke draft</button>
        <button type="submit" name="mode" value="clone" class="secondary-button">Duplikasi sebagai item baru</button>
      </div>
    </form>
  </main>
  <footer><span>PW155 Boutique Editor</span><span>Draft tervalidasi sebelum pemasangan</span></footer>
</body>
</html>
